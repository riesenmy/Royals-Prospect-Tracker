<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Royals Prospects 2026 Stats</title>
  <link rel="icon" href="images/batter1.png" type="image/png">
  <style>
  @font-face {
    font-family: 'MyFont';
    src: url('fonts/website.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }
  body {
    background-color: #004687;
    color: white;
    font-family: 'MyFont', sans-serif;
  }
  table {
    background-color: white;
    color: black;
    border-collapse: collapse;
    margin: 1em 0;
    width: 100%;
    table-layout: auto; 
  }
  th, td {
    border: 1px solid #ccc;
    padding: 0.5em;
  }
  th {
    background-color: #BD9B60;
    cursor: pointer;
  }
  td {
    background-color: #7AB2DD;
    color: white;
    text-align: center;
    word-wrap: break-word;
  }
  td:first-child {
    text-align: left;
  }
  td:nth-child(6), td:nth-child(7), td:nth-child(8), td:nth-child(10), td:nth-child(11), td:nth-child(12), td:nth-child(13), td:nth-child(14), {
    text-align: center;
  }
  tr:nth-child(even) td {
    background-color: #6aa3cf;
    color: white;
  }
.header {
  display: flex;
  align-items: center;
  gap: 1em; /* spacing between image and text */
  padding: 1em;
  }
.filter-container {
  margin: 1em;
  text-align: center;
}
.filter-btn {
  background-color: #BD9B60;
  color: white;
  border: none;
  padding: 0.5em 1em;
  font-size: 1em;
  font-family: 'MyFont', sans-serif;
  border-radius: 6px;
  cursor: pointer;
  margin: 0 0.5em;
}

.filter-btn:hover {
  background-color: #a8844f;
}

.filter-btn.active {
  background-color: #7AB2DD;
}

.logo {
  height: 60px; /* or whatever size fits best */
}
#audio-toggle {
  background-color: #BD9B60;  /* gold-like color */
  color: white;
  border: none;
  padding: 0.5em 1em;
  font-size: 1em;
  font-family: 'MyFont', sans-serif;
  border-radius: 6px;
  cursor: pointer;
  margin: 1em;
}

#audio-toggle:hover {
  background-color: #a8844f;
}
</style>
</head>
<body>
    <div class="header">
    <img src="images/batter1.png" alt="Logo" class="logo">
    <h1>Royals Prospects 2026 Stats</h1>
      <div class="filter-container">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="batters">Batters</button>
        <button class="filter-btn" data-filter="pitchers">Pitchers</button>
      </div>
    </div>
  <table id="data-table"></table>

  <audio id="theme-audio" loop>
  <source src="audio/RoyalsWillSoar1.mp3" type="audio/mpeg">
  Your browser does not support the audio element.
  </audio>

  <button id="audio-toggle">Play Music</button>

  <script>
    const audio = document.getElementById('theme-audio');
    const button = document.getElementById('audio-toggle');
  
    // Try to autoplay (some browsers will block it)
    document.addEventListener('DOMContentLoaded', () => {
      audio.play().catch(() => {
        // Autoplay failed; wait for user to click
      });
    });
  
    button.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        button.textContent = 'Pause Music';
      } else {
        audio.pause();
        button.textContent = 'Play Music';
      }
    });
  </script>
  
  <script>
  function parseCSV(csvText) {
    const rows = [];
    let row = [];
    let cell = '';
    let inQuotes = false;

    for (let i = 0; i < csvText.length; i++) {
      const char = csvText[i];
      const nextChar = csvText[i + 1];

      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          cell += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        row.push(cell);
        cell = '';
      } else if ((char === '\n' || char === '\r') && !inQuotes) {
        if (char === '\r' && nextChar === '\n') i++;
        row.push(cell);
        if (row.some(value => value.trim() !== '')) {
          rows.push(row);
        }
        row = [];
        cell = '';
      } else {
        cell += char;
      }
    }

    if (cell.length > 0 || row.length > 0) {
      row.push(cell);
      if (row.some(value => value.trim() !== '')) {
        rows.push(row);
      }
    }

    return rows;
  }

  function showError(message) {
    const table = document.getElementById('data-table');
    table.innerHTML = '';
    const row = document.createElement('tr');
    const cell = document.createElement('td');
    cell.textContent = message;
    cell.style.textAlign = 'center';
    cell.style.padding = '1em';
    row.appendChild(cell);
    table.appendChild(row);
  }

  async function loadCSV() {
    const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRUEUZo9Ih_lXcV-xwBqKo9kZDqhcDgfIVXS3UwsexNqSv5q1Oh7LIZRAduhT6dvhBMq6ezHAroO6A4/pub?gid=782331485&single=true&output=csv';

    let rows;
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`Request failed with status ${response.status}`);
      }

      const csvText = await response.text();
      rows = parseCSV(csvText);
    } catch (error) {
      console.error('Could not load player data:', error);
      showError('Unable to load player data right now. Please verify the Google Sheet is still published to the web and publicly accessible.');
      return;
    }

    if (!rows || rows.length < 2) {
      showError('No player rows were found in the published sheet.');
      return;
    }

    const table = document.getElementById('data-table');
    const headers = rows[0];
    const normalizeHeader = (header) => header.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
    const isPitcherPosition = (positionValue) => {
      const normalizedPosition = (positionValue || '').toUpperCase();
      if (!normalizedPosition) return false;

      const positionTokens = normalizedPosition
        .split(/[^A-Z0-9]+/)
        .map(token => token.trim())
        .filter(Boolean);

      const pitcherTokens = new Set(['P', 'SP', 'RP', 'RHP', 'LHP']);
      return positionTokens.some(token => pitcherTokens.has(token));
    };
    const decimalHeaderPatterns = [
      /^avg$/,
      /^obp$/,
      /^slg$/,
      /^ops$/,
      /^woba$/,
      /^babip$/,
      /^era$/,
      /^fip$/,
      /^xfip$/,
      /^whip$/,
      /^k9$/,
      /^bb9$/,
      /^hr9$/,
      /^kbb$/
    ];
    const formatIndexes = headers
      .map((header, i) => {
        const normalized = normalizeHeader(header);
        return decimalHeaderPatterns.some((pattern) => pattern.test(normalized)) ? i : -1;
      })
      .filter(i => i !== -1);
    const positionColumnIndex = headers.findIndex((header) => {
      const normalized = normalizeHeader(header);
      return normalized === 'pos' || normalized === 'position';
    });
    const hiddenColumnIndexes = new Set(
      headers
        .map((header, index) => ({ header, index }))
        .filter(({ header }) => {
          const normalized = normalizeHeader(header);
          return normalized === 'sourceurl' || normalized === 'notes';
        })
        .map(({ index }) => index)
    );
    const bbColumnIndex = headers.findIndex((header) => normalizeHeader(header) === 'bb');
    const kColumnIndex = headers.findIndex((header) => normalizeHeader(header) === 'k');

    let dataRows = rows.slice(1); // Skip header
    let currentSort = { index: null, direction: 'asc' };
    let currentFilter = 'all';

    function renderTable(sortedData) {
      table.innerHTML = ''; // Clear table

      // Apply filter to the data
      const filteredData = sortedData.filter(row => {
      if (positionColumnIndex === -1) return true;

      const position = row[positionColumnIndex];
      const pitcher = isPitcherPosition(position);
    
      if (currentFilter === 'batters') return !pitcher;
      if (currentFilter === 'pitchers') return pitcher;
      return true; // 'all'
    });

      // Header row
      const headerRow = document.createElement('tr');
      headers.forEach((header, index) => {
        if (hiddenColumnIndexes.has(index)) return;
        const th = document.createElement('th');
        const isSorted = currentSort.index === index;
        const arrow = isSorted ? (currentSort.direction === 'asc' ? ' ▲' : ' ▼') : '';
        th.innerHTML = header + arrow;

        th.addEventListener('click', () => {
          let direction = 'asc';

          if (currentSort.index === index && currentSort.direction === 'asc') {
            direction = 'desc';
          }

          currentSort = { index, direction };

          const sampleVal = filteredData[0]?.[index] || '';
          const isNumeric = !isNaN(parseFloat(sampleVal)) && isFinite(sampleVal);
          filteredData.sort((a, b) => {
            let valA = a[index], valB = b[index];
            if (isNumeric) {
              valA = parseFloat(valA);
              valB = parseFloat(valB);
              if (isNaN(valA)) valA = -Infinity;
              if (isNaN(valB)) valB = -Infinity;
            }
            return direction === 'asc'
              ? (valA > valB ? 1 : valA < valB ? -1 : 0)
              : (valA < valB ? 1 : valA > valB ? -1 : 0);
          });

          renderTable(filteredData);
        });

        headerRow.appendChild(th);
      });
      table.appendChild(headerRow);

      // Data rows
      filteredData.forEach(row => {
        const tr = document.createElement('tr');
        row.forEach((cell, colIndex) => {
          if (hiddenColumnIndexes.has(colIndex)) return;

          const td = document.createElement('td');
          const isPitcher = positionColumnIndex !== -1 && isPitcherPosition(row[positionColumnIndex]);
          if (isPitcher && (colIndex === bbColumnIndex || colIndex === kColumnIndex)) {
            td.textContent = '';
            tr.appendChild(td);
            return;
          }

          if (formatIndexes.includes(colIndex)) {
            const num = parseFloat(cell);
            td.textContent = isNaN(num) ? cell : num.toFixed(3);
            td.style.textAlign = 'right';
          } else {
            td.textContent = cell;
          }
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
    }

    // Set up filter button listeners
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.getAttribute('data-filter');
        renderTable(dataRows);
      });
    });

    renderTable(dataRows); // Initial render
  }

  loadCSV();
</script>
</body>
</html>
